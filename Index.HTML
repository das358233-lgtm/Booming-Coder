
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan EMI Calculator</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      padding: 30px 15px;
      color: #1e293b;
    }

    .container {
      max-width: 460px;
      margin: 30px auto;
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 6px 25px #d5dce5;
    }

    h1 { text-align: center; color: #1d4ed8; }

    .subtitle {
      text-align: center;
      color: #64748b;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border-radius: 8px;
      font-size: 16px;
    }

    input { border: 1px solid #cbd5e1; }

    button {
      background: #2563eb;
      color: white;
      border: none;
      margin-top: 24px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background: #1d4ed8; }

    .results {
      background: #eff6ff;
      padding: 18px;
      border-radius: 10px;
      margin-top: 22px;
    }

    .results p { font-size: 16px; }

    .value {
      font-weight: bold;
      color: #1d4ed8;
    }

    .error { color: #b91c1c; }
  </style>
</head>
<body>

<div class="container">
  <h1>Loan EMI Calculator</h1>
  <p class="subtitle">
    Calculate your monthly loan repayments easily.
  </p>

  <label for="loan">Loan Amount (₹)</label>
  <input type="number" id="loan"
    placeholder="Example: 500000"
    min="0.01" step="any">

  <label for="rate">Annual Interest Rate (%)</label>
  <input type="number" id="rate"
    placeholder="Example: 8.5"
    min="0" step="any">

  <label for="years">Loan Tenure (Years)</label>
  <input type="number" id="years"
    placeholder="Example: 5"
    min="0.01" step="any">

  <button onclick="calculateEMI()">
    Calculate EMI
  </button>

  <p id="error" class="error" role="alert"></p>

  <div class="results" id="results" hidden>
    <h2>Loan Summary</h2>
    <p>Monthly EMI:
      <span class="value" id="emi"></span>
    </p>
    <p>Total Interest:
      <span class="value" id="interest"></span>
    </p>
    <p>Total Repayment:
      <span class="value" id="repayment"></span>
    </p>
  </div>
</div>

<script>
function calculateEMI() {
  const loanInput = document.getElementById("loan").value;
  const rateInput = document.getElementById("rate").value;
  const yearsInput = document.getElementById("years").value;

  const P = Number(loanInput);
  const annualRate = Number(rateInput);
  const years = Number(yearsInput);

  const error = document.getElementById("error");
  const results = document.getElementById("results");

  error.textContent = "";
  results.hidden = true;

  if (
    loanInput.trim() === "" ||
    rateInput.trim() === "" ||
    yearsInput.trim() === "" ||
    !Number.isFinite(P) ||
    !Number.isFinite(annualRate) ||
    !Number.isFinite(years) ||
    P <= 0 ||
    annualRate < 0 ||
    years <= 0 ||
    !Number.isInteger(years * 12)
  ) {
    error.textContent =
      "Enter valid values. The tenure must be a whole number of months.";
    return;
  }

  const monthlyRate = annualRate / 12 / 100;
  const months = Math.round(years * 12);

  let emi;

  if (monthlyRate === 0) {
    emi = P / months;
  } else {
    const factor = Math.pow(1 + monthlyRate, -months);
    emi = P * monthlyRate / (1 - factor);
  }

  const totalRepayment = emi * months;
  const totalInterest = totalRepayment - P;

  if (!Number.isFinite(emi) ||
      !Number.isFinite(totalRepayment)) {
    error.textContent = "Unable to calculate. Check your inputs.";
    return;
  }

  const formatINR = value =>
    new Intl.NumberFormat("en-IN", {
      style: "currency",
      currency: "INR",
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }).format(value);

  document.getElementById("emi").textContent =
    formatINR(emi);
  document.getElementById("interest").textContent =
    formatINR(Math.max(0, totalInterest));
  document.getElementById("repayment").textContent =
    formatINR(totalRepayment);

  results.hidden = false;
}
</script>

</body>
</html>
